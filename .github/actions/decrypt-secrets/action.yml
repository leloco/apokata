name: 'Decrypt secrets'
description: 'Decrypt secrets (everything outside of gitops/)'

inputs:
  sops-age-key:
    description: 'The private Age key'
    required: true
  env:
    required: true

runs:
  using: "composite"
  steps:
    - name: Decrypt secrets
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        echo "==> Starting decryption of secrets..."

        # Decrypt OpenTofu sops.env files
        ENV_FILES=$(find opentofu/ -type f -name "*${{ inputs.env }}*.sops.env")
        if [ -n "$ENV_FILES" ]; then
          for f in $ENV_FILES; do
            output_file="${f//.sops/}"
            echo "Decrypting OpenTofu file: $f -> $output_file"
            .venv/bin/sops --decrypt --input-type dotenv --output-type dotenv "$f" > "$output_file"
          done
        else
          echo "Warning: No *.sops.env files found."
        fi

        echo "==> Decryption completed successfully!"
