name: 'Install Environment'
description: 'Installs venv, pip packages, other binaries and Ansible collections'
inputs:
  ansible_vault_password:
    description: 'Vault password'
    required: true
  ssh_public_key:
    required: true
  env:
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache Environment
      uses: actions/cache@v4
      with:
        path: |
          .venv
          ./ansible/collections
        key: ${{ runner.os }}-ansible-${{ hashFiles('./requirements.txt', './ansible/requirements.yml') }}
        restore-keys: |
          ${{ runner.os }}-ansible-

    - name: Run Install Script
      shell: bash
      run: ./scripts/install.sh

    - name: Create Ansible Vault Pass File
      shell: bash
      env:
        VAULT_PASS_FILE: "/root/.ansible_vault_pass_${{ inputs.env }}"
      run: |
        echo "${{ inputs.ansible_vault_password }}" > "$VAULT_PASS_FILE"
        chmod 600 "$VAULT_PASS_FILE"

    - name: Create SSH Public Key File
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_public_key }}" > ~/.ssh/id_rsa.pub
