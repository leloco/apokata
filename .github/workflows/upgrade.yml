name: "Infrastructure Package Upgrades"

env:
  OPENTOFU_WORKING_DIR: "./opentofu/infra"
  ANSIBLE_WORKING_DIR: "./ansible"
  OPENTOFU_VERSION: 1.10.7

on:
  schedule:
    - cron: '0 23 * * 4'
  workflow_dispatch:
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  upgrade_apt_packages:
    name: "Upgrade apt packages"
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Load full history

      - name: Decrypt Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          gpg_key: ${{ secrets.GPG_KEY }}

      - name: Setup Ansible Tools
        uses: ./.github/actions/install-ansible
        with:
          ansible_vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Setup OpenTofu Tools
        uses: ./.github/actions/opentofu-prep
        with:
          ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Install OpenTofu CLI
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: ${{ env.OPENTOFU_WORKING_DIR }}
        run: tofu init

      - name: OpenTofu Generate inventory.ini
        working-directory: ${{ env.OPENTOFU_WORKING_DIR }}
        run: tofu apply -var-file="../shared.tfvars" -target=local_file.ansible_inventory -replace=local_file.ansible_inventory -auto-approve -lock=false

      - name: Install SSH Private Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "unnecessary"
          if_key_exists: fail

      - name: Run Ansible Playbook
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          LOG_FILE="ansible_run_${{ github.run_number }}_id_${{ github.run_id }}.log"
          echo "ANSIBLE_LOG_PATH=${LOG_FILE}" >> $GITHUB_ENV

          ansible-playbook -i inventory.ini apt_upgrade_playbook.yml --tags repair > "$LOG_FILE" 2>&1
        continue-on-error: false

      - name: Display Play Recap Only
        if: always()
        run: |
          echo "====================================================================="
          grep -A 100 "PLAY RECAP" "${{ env.ANSIBLE_LOG_PATH }}" || echo "PLAY RECAP not found."
          echo "====================================================================="

      - name: Upload Detailed Ansible Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-detailed-log-run-${{ github.run_number }}
          path: ${{ env.ANSIBLE_LOG_PATH }}
          retention-days: 7
