<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 62" width="100%" height="100%">
  <!-- GECROPPTE VIEWBOX FÜR OPTIMALE HEADER-DARSTELLUNG -->
  
  <!-- 1. Der 3D Cube im Zentrum -->
  <g id="cube" stroke-linejoin="round">
    <!-- Top Face (Lichtdach) -->
    <polygon points="27,0 48,12 27,24 6,12" fill="#fdba74" />
    
    <!-- Left Face (Hauptton) -->
    <polygon points="6,12 27,24 27,46 6,34" fill="#f97316" />
    
    <!-- Right Face (Schatten) -->
    <polygon points="27,24 48,12 48,34 27,46" fill="#ea580c" />

    <!-- Feine Lichtkante vorne -->
    <line x1="27" y1="24" x2="27" y2="46" stroke="#ffedd5" stroke-width="0.6" opacity="0.45" />
  </g>

  <!-- 2. Untere Halte-Ecken & Flanken (State Boundaries im passenden Farbverlauf) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Untere vordere Haltekante -->
    <polyline points="13,48 27,56 41,48" stroke="#f97316" stroke-width="2" />
    
    <!-- Flanken-Begrenzer -->
    <line x1="0" y1="18" x2="0" y2="30" stroke="#f97316" stroke-width="1.8" />
    <line x1="54" y1="18" x2="54" y2="30" stroke="#ea580c" stroke-width="1.8" />
  </g>
</svg>
