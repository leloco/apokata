<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- ================= 1. DUNKELGRAUE MAGNETISCHE BASIS ================= -->
  <!-- Sockel-Körper (Schattenkante) -->
  <path d="M 28 116 
           C 28 127 51 136 80 136 
           C 109 136 132 127 132 116 
           L 132 124 
           C 132 135 109 144 80 144 
           C 51 144 28 135 28 124 Z" 
        fill="#0f172a" />

  <!-- Sockel-Oberfläche (Dunkles Slate-Grau) -->
  <ellipse cx="80" cy="116" rx="52" ry="20" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
  
  <!-- Innere Magnet-Nut (Core Docking Ring) -->
  <ellipse cx="80" cy="116" rx="34" ry="13" fill="#0f172a" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.8" />
  <ellipse cx="80" cy="116" rx="14" ry="5.5" fill="#00f2fe" opacity="0.25" />

  <!-- ================= 2. MAGNETISCHES KRAFTFELD (STATE SYNC) ================= -->
  <!-- Vertikale Drift-Korrektur-Linien -->
  <line x1="80" y1="84" x2="80" y2="114" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 3" opacity="0.85" />
  <line x1="56" y1="72" x2="56" y2="108" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.45" />
  <line x1="104" y1="72" x2="104" y2="108" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Äußere Kraftfeld-Klammern (Haltekraft) -->
  <path d="M 44 86 C 36 94 36 104 46 112" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 116 86 C 124 94 124 104 114 112" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- ================= 3. SCHWEBENDER ORANGE CONTAINER CUBE ================= -->
  <g transform="translate(80, 52)">
    <!-- Top Face (Hell/Lichtquelle) -->
    <polygon points="0,-24 26,-9 0,6 -26,-9" fill="#fb923c" stroke="#fed7aa" stroke-width="1" />
    
    <!-- Left Face (Signal-Orange) -->
    <polygon points="-26,-9 0,6 0,36 -26,21" fill="#f97316" />
    
    <!-- Right Face (Dunkleres Schattierungs-Orange) -->
    <polygon points="0,6 26,-9 26,21 0,36" fill="#c2410c" />
    
    <!-- Präzise Kanten-Lichtlinie -->
    <line x1="0" y1="6" x2="0" y2="36" stroke="#fed7aa" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
