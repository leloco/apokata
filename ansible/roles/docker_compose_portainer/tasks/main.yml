---
- name: Ensure target and mount directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ portainer_base_dir }}"
    - "{{ portainer_mount_base }}"

- name: Create docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_base_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy and start Portainer stack
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_base_dir }}"
    state: present
