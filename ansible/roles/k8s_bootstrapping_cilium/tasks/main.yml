---
- name: Download and extract Helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes

- name: Move Helm binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: yes

- name: Add Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/

- name: Install Cilium via Helm
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      kubeProxyReplacement: true
      k8sServiceHost: "{{ ansible_host }}"
      k8sServicePort: 6443
      # INFO: IPAM-Configuration
      # No Pod-CIDR reference here. Cilium uses per default 'ipam.mode: kubernetes'.
      # Fetches 'pod_network_cidr' (10.244.0.0/16) automatically
      # from kube API (defined in 'kubeadm init').
      bgpControlPlane:
        enabled: true
