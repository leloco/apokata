---
- name: Encrypt backup file with age (Client-Side Encryption)
  ansible.builtin.command:
    cmd: "age -r {{ backup_age_public_key }} -o {{ backup_src_file }}.age {{ backup_src_file }}"
  changed_when: true
  no_log: true

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    dest: "/tmp/awscliv2.zip"
    mode: "0644"

- name: Unpack AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: "/tmp/awscliv2.zip"
    dest: "/tmp"
    remote_src: true

- name: Run AWS CLI installer
  ansible.builtin.command: /tmp/aws/install --update
  args:
    creates: /usr/local/bin/aws
  become: true

- name: Clean up temporary installer files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws

- name: Upload encrypted backup to Cloudflare R2
  ansible.builtin.command: >
    aws s3 cp "{{ backup_src_file }}.age"
    "s3://{{ backup_target_bucket }}/{{ backup_prefix }}{{ backup_target_filename }}.age"
    --endpoint-url "{{ r2_endpoint }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
    AWS_DEFAULT_REGION: "auto"
  changed_when: true

- name: Clean up temporary unencrypted and encrypted files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ backup_src_file }}"
    - "{{ backup_src_file }}.age"
