---
- name: Encrypt backup file with age (Client-Side Encryption)
  ansible.builtin.command:
    cmd: "age -r {{ backup_age_public_key }} -o {{ backup_src_file }}.age {{ backup_src_file }}"
  changed_when: true
  no_log: true


- name: Ensure AWS CLI is installed (on Debian)
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'

- name: Ensure AWS CLI is installed (on RHEL/Fedora)
  ansible.builtin.dnf:
    name: awscli
    state: present
  become: true
  when: ansible_os_family == 'RedHat'

- name: Upload encrypted backup to Cloudflare R2
  ansible.builtin.command: >
    aws s3 cp "{{ backup_src_file }}.age"
    "s3://{{ backup_target_bucket }}/{{ backup_prefix }}{{ backup_target_filename }}.age"
    --endpoint-url "{{ r2_endpoint }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
    AWS_DEFAULT_REGION: "auto"
  changed_when: true

- name: Clean up temporary unencrypted and encrypted files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ backup_src_file }}"
    - "{{ backup_src_file }}.age"
