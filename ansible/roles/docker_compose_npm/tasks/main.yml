---
- name: Load secret variables
  ansible.builtin.include_vars:
    file: secrets.yml

- name: Ensure target and mount directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ npm_base_dir }}"
    - "{{ npm_mount_base }}/data"
    - "{{ npm_mount_base }}/letsencrypt"
    - "{{ npm_mount_base }}/db"

- name: Create npm app env file from template
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ npm_base_dir }}/{{ inventory_hostname }}.env"
    mode: '0600'

- name: Create npm db env file from template
  ansible.builtin.template:
    src: db.env.j2
    dest: "{{ npm_base_dir }}/{{ inventory_hostname }}_db.env"
    mode: '0600'

- name: Create docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ npm_base_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy and start stack
  community.docker.docker_compose_v2:
    project_src: "{{ npm_base_dir }}"
    state: present
