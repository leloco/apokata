---
- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ portainer_agent_base_dir }}"
    state: directory
    mode: '0755'

- name: Create docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_agent_base_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy and start Portainer Agent stack
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_agent_base_dir }}"
    state: present

- name: Register Agent environment in Portainer Server via HTTPS API
  ansible.builtin.uri:
    url: "https://{{ hostvars['z1-portainer']['portainer_server_fqdn'] }}/api/endpoints"
    method: POST
    headers:
      X-API-Key: "{{ group_vars_vault_portainer_access_token }}"
      Content-Type: "application/json"
    body_format: form-multipart
    body:
      Name: "{{ inventory_hostname }}"
      EndpointCreationType: "2"
      URL: "tcp://{{ ansible_default_ipv4.address }}:9001"
      TLS: "true"
      TLSSkipVerify: "true"
      TLSSkipClientVerify: "true"
    status_code: [200, 201, 409]
    validate_certs: true
  register: portainer_agent_register
  changed_when: portainer_agent_register.status in [200, 201]
